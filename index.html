<style>
@font-face{font-family:"GenEi M Gothic";src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"GenEi M Gothic";src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Medium.ttf") format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"GenEi M Gothic";src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#E9E2D0;--card:rgba(255,255,255,.24);--ink:#6C4732;--muted:#806a5c;--line:rgba(108,71,50,.22);--accent:#6C4732;--input:rgba(255,255,255,.58);--glass-border:rgba(108,71,50,.22);--control-border:rgba(108,71,50,.38);--deco:#6C4732}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171b25;--card:rgba(43,46,56,.76);--ink:#e7e9ee;--muted:#a5aab5;--line:rgba(255,255,255,.10);--accent:#91aaff;--input:rgba(30,34,43,.58);--glass-border:rgba(255,255,255,.12);--control-border:rgba(255,255,255,.2);--deco:#596170}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 15px 42px;color:var(--ink);font-family:"GenEi M Gothic",system-ui,sans-serif;background:var(--bg);transition:background-color .28s,color .28s}
main{max-width:600px;margin:auto}
header{margin:0 0 22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:750;letter-spacing:.12em;color:var(--accent);text-decoration:none}.brand-mark{display:block;width:20px;height:20px;flex:none}
.theme-toggle{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--control-border);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}.theme-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:30px;margin:7px 0}.sub,.hint,footer{color:var(--muted);font-size:13px;line-height:1.7}
.card{position:relative;isolation:isolate;margin:17px 0;padding:20px 18px;border:0;border-radius:0;background:transparent;box-shadow:none}
.card:before,.card:after{content:"";position:absolute;pointer-events:none;z-index:0;transition:all .32s ease-out}
.card:before{top:-6px;bottom:-6px;left:0;right:0;border-left:2px solid var(--deco);border-right:2px solid var(--deco)}
.card:after{top:0;bottom:0;left:-6px;right:-6px;border-top:2px solid var(--deco);border-bottom:2px solid var(--deco)}
.card>*{position:relative;z-index:1}
h2{font-size:16px;margin:0 0 15px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 23px}
.tab{padding:11px 5px;border:1px solid var(--control-border);border-radius:10px;background:var(--input);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.panel[hidden]{display:none}
.clock-date{text-align:center;color:var(--muted);font-size:14px;margin:3px 0 12px}
.digital{text-align:center;font-size:clamp(42px,12vw,68px);font-weight:700;letter-spacing:.025em;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-caption{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.clock-design-switch{display:flex;justify-content:center;gap:8px;margin:18px 0 0}
.clock-design-button,.pixel-shape-button{padding:8px 14px;border:1px solid var(--control-border);border-radius:999px;background:var(--input);color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.clock-design-button[aria-pressed="true"],.pixel-shape-button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pixel-clock-wrap{position:relative;width:100%;height:300px;margin-top:12px;overflow:hidden}
#pixelClockCanvas{display:block;width:100%;height:100%;touch-action:pan-y}
.pixel-clock-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.pixel-shapes{display:flex;gap:6px;flex-wrap:wrap}
.pixel-scatter{padding:9px 14px;border:1px solid var(--control-border);border-radius:999px;background:var(--input);color:var(--ink);font:inherit;font-size:12px}
@media(max-width:480px){.pixel-clock-wrap{height:230px}.pixel-clock-controls{justify-content:center}.pixel-scatter{width:100%}}
@media (orientation:landscape){.pixel-clock-wrap{height:360px}}
@media (orientation:landscape){main{max-width:900px}.card:has(#clockTime){padding:30px 24px}.clock-date{font-size:17px;margin-bottom:14px}.digital{font-size:clamp(64px,12vw,128px);letter-spacing:.045em;line-height:1.2}.clock-caption{font-size:14px;margin-top:14px}}
.field{display:block;color:var(--muted);font-size:13px;font-weight:650}
.field input{display:block;width:100%;min-width:0;margin-top:7px;padding:12px;border:1px solid var(--control-border);border-radius:10px;background:var(--input);color:var(--ink);font:inherit;font-size:16px;color-scheme:inherit}
.countdown-display{text-align:center;font-variant-numeric:tabular-nums;margin:18px 0 8px}
.countdown-empty{font-size:15px;font-weight:500;color:var(--muted);padding:10px 0}
.countdown-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.countdown-form .field{min-width:0}.countdown-form .field input{font-size:14px;padding:10px}
.countdown-list{display:grid;gap:18px;margin-top:22px}
.countdown-item{padding:15px 13px;border:1px solid var(--control-border);border-radius:12px;background:var(--card);min-width:0}
.countdown-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.countdown-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.countdown-delete{border:1px solid var(--control-border);border-radius:8px;background:var(--input);color:var(--muted);padding:6px 10px;font-size:12px;flex:none}
.countdown-target{font-size:11px;color:var(--muted);text-align:center;margin-bottom:7px}
.countdown-item .countdown-main{font-size:clamp(25px,6vw,38px);font-weight:700;line-height:1.35}
.countdown-item .countdown-units{margin-top:10px}
.countdown-item .unit{padding:7px 3px}.countdown-item .unit strong{font-size:21px}
.countdown-item .countdown-expired{font-size:17px;color:var(--accent);font-weight:700;text-align:center;padding:14px 0}
@media(max-width:480px){.countdown-form{grid-template-columns:1fr}.countdown-form .actions{margin-top:0}}
.countdown-main{font-size:clamp(31px,8vw,48px);font-weight:700;line-height:1.35}
.countdown-units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:15px}
.unit{padding:10px 4px;border:1px solid var(--control-border);border-radius:10px;background:var(--input);text-align:center}
.unit strong{display:block;font-size:25px;color:var(--accent)}.unit small{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s,transform .15s}
button:active{transform:scale(.98) translateY(1px)}
.primary,.secondary,.danger{padding:12px 17px;border-radius:10px;font-weight:700}
.primary{border:0;background:var(--accent);color:white}.secondary{border:1px solid var(--control-border);background:var(--input);color:var(--ink)}.danger{border:1px solid #dc3545;background:#dc3545;color:#fff}
.stopwatch-time{text-align:center;font-size:clamp(45px,12vw,66px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:13px 0 18px}
.lap-heading{display:flex;justify-content:space-between;align-items:center;margin:23px 0 9px;font-size:14px;font-weight:700}
.lap-list{list-style:none;padding:0;margin:0;max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.lap-list li{display:grid;grid-template-columns:45px 1fr 1fr;gap:8px;padding:10px 3px;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.lap-list li span:last-child{text-align:right}.lap-list .best{color:#4b9b79}.lap-list .worst{color:#d17b58}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
footer{font-size:11px;padding:10px 3px}
@media(max-width:390px){h1{font-size:26px}.card{padding:17px 14px}.tab{font-size:12px}.countdown-units{gap:5px}.unit strong{font-size:22px}.actions button{flex:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

<script>
const root=document.documentElement,themeToggle=document.getElementById('themeToggle');
function applyTheme(theme){root.dataset.theme=theme;try{localStorage.setItem('pantaro_theme',theme)}catch(e){}themeToggle.innerHTML=theme==='dark'?'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';themeToggle.setAttribute('aria-label',theme==='dark'?'ライトモードに切り替え':'ナイトモードに切り替え')}
let initial='light';try{initial=localStorage.getItem('pantaro_theme')||'light'}catch(e){}applyTheme(initial);
themeToggle.addEventListener('click',()=>applyTheme(root.dataset.theme==='dark'?'light':'dark'));
// タブ切り替え
const tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];
function selectTab(id){tabs.forEach(t=>{const active=t.id==='tab-'+id;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1});panels.forEach(p=>p.hidden=p.id!=='panel-'+id)}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>selectTab(tab.id.replace('tab-','')));tab.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=(i+(e.key==='ArrowRight'?1:2))%3;tabs[next].focus();tabs[next].click()}})});
selectTab('clock');
// 時計デザイン切り替え・Pixel Flow（数字ごとの縦スライド）
const simpleClockView=document.getElementById('simpleClockView');
const pixelClockView=document.getElementById('pixelClockView');
const designButtons=[...document.querySelectorAll('.clock-design-button')];
let clockDesign='simple';
designButtons.forEach(button=>button.addEventListener('click',()=>{
 clockDesign=button.dataset.design;
 simpleClockView.hidden=clockDesign!=='simple';
 pixelClockView.hidden=clockDesign!=='pixel';
 designButtons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 if(clockDesign==='pixel'){resizePixelCanvas();setPixelTime(lastClockText,true)}
}));
const pixelCanvas=document.getElementById('pixelClockCanvas');
const pixelCtx=pixelCanvas.getContext('2d');
let pixelGroups=[],pixelShape='square',lastClockText='00:00:00',pixelPointer=null;
const PIXEL_STEP=7,SLIDE_MS=260;
function resizePixelCanvas(){
 const rect=pixelCanvas.getBoundingClientRect();if(!rect.width||!rect.height)return;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 pixelCanvas.width=Math.round(rect.width*dpr);pixelCanvas.height=Math.round(rect.height*dpr);
 pixelCtx.setTransform(dpr,0,0,dpr,0,0);
 setPixelTime(lastClockText,true);
}
function pixelGlyph(char,cellWidth,h,fontSize){
 const off=document.createElement('canvas');off.width=Math.max(1,Math.ceil(cellWidth));off.height=Math.max(1,Math.ceil(h));
 const ctx=off.getContext('2d',{willReadFrequently:true});
 ctx.font='700 '+fontSize+'px "GenEi M Gothic", system-ui, sans-serif';
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(char,cellWidth/2,h/2);
 const data=ctx.getImageData(0,0,off.width,off.height).data,points=[];
 // 各ピクセルブロックの中央をサンプリングし、細い文字でも点が残るようにする
 for(let y=0;y<h;y+=PIXEL_STEP)for(let x=0;x<cellWidth;x+=PIXEL_STEP){
  const sx=Math.min(off.width-1,Math.floor(x+PIXEL_STEP/2));
  const sy=Math.min(off.height-1,Math.floor(y+PIXEL_STEP/2));
  if(data[(sy*off.width+sx)*4+3]>24)points.push({x:x+PIXEL_STEP/2,y:y+PIXEL_STEP/2});
 }
 // フォント読み込み直後などにサンプリング結果が空なら、細かい間隔でもう一度取得
 if(!points.length){
  for(let y=0;y<h;y+=3)for(let x=0;x<cellWidth;x+=3){
   if(data[(Math.floor(y)*off.width+Math.floor(x))*4+3]>24)points.push({x:x+1.5,y:y+1.5});
  }
 }
 return points;
}
function setPixelTime(text,instant=false){
 const rect=pixelCanvas.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;
 const fontSize=Math.min(h*.48,w/(text.length*.62)),measure=document.createElement('canvas').getContext('2d');
 measure.font='700 '+fontSize+'px "GenEi M Gothic", system-ui, sans-serif';
 const widths=[...text].map(c=>measure.measureText(c).width),total=widths.reduce((a,b)=>a+b,0);
 const scale=Math.min(1,w*.92/total),cellWidths=widths.map(v=>v*scale),font=fontSize*scale;
 let x=(w-total*scale)/2,now=performance.now();
 const next=[...text].map((char,i)=>{
  const cellWidth=cellWidths[i],glyph=pixelGlyph(char,cellWidth,h,font);
  const group=pixelGroups[i];
  if(!group||instant||group.char===char)return {char,x,cellWidth,glyph,oldGlyph:null,changedAt:0};
  return {char,x,cellWidth,glyph,oldGlyph:group.glyph,changedAt:now};
 }).map((g,i)=>{g.x=(w-total*scale)/2+cellWidths.slice(0,i).reduce((a,b)=>a+b,0);return g});
 pixelGroups=next;
}
function setPixelShape(shape){pixelShape=shape;document.querySelectorAll('.pixel-shape-button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shape===shape)))}
document.querySelectorAll('.pixel-shape-button').forEach(b=>b.addEventListener('click',()=>setPixelShape(b.dataset.shape)));
document.getElementById('pixelScatter').addEventListener('click',()=>{
 pixelGroups.forEach(g=>{g.scatterUntil=performance.now()+650;g.scatterSeed=Math.random()*Math.PI*2});
});
function drawGlyph(points,x,y,offset,color,scatter=0,seed=0){
 pixelCtx.fillStyle=color;
 points.forEach((p,i)=>{
  let dx=0,dy=0;
  if(scatter){const a=seed+i*2.399;dx=Math.cos(a)*scatter;dy=Math.sin(a)*scatter}
  if(pixelPointer){
   const px=x+p.x,py=y+p.y+offset,ddx=px-pixelPointer.x,ddy=py-pixelPointer.y,d=Math.hypot(ddx,ddy)||1;
   if(d<85){const force=(85-d)/85*9;dx+=ddx/d*force;dy+=ddy/d*force}
  }
  const px=x+p.x+dx,py=y+p.y+offset+dy;
  if(pixelShape==='circle'){pixelCtx.beginPath();pixelCtx.arc(px,py,2.2,0,Math.PI*2);pixelCtx.fill()}
  else if(pixelShape==='cross'){pixelCtx.fillRect(px-1,py-3,2,6);pixelCtx.fillRect(px-3,py-1,6,2)}
  else pixelCtx.fillRect(px-2,py-2,4,4);
 });
}
function pixelLoop(){
 const rect=pixelCanvas.getBoundingClientRect(),w=rect.width,h=rect.height,now=performance.now();
 if(w&&h&&!pixelClockView.hidden){
  pixelCtx.clearRect(0,0,w,h);const color=getComputedStyle(root).getPropertyValue('--ink').trim()||'#6C4732';
  pixelGroups.forEach(g=>{
   const progress=g.changedAt?Math.min(1,(now-g.changedAt)/SLIDE_MS):1;
   const eased=1-Math.pow(1-progress,3);
   const scatter=g.scatterUntil&&now<g.scatterUntil?((g.scatterUntil-now)/650)*7:0;
   if(g.oldGlyph&&progress<1)drawGlyph(g.oldGlyph,g.x,h*.26-eased*h*.72,color,scatter,g.scatterSeed||0);
   drawGlyph(g.glyph,g.x,h*.26+(g.oldGlyph?(1-eased)*h*.72:0),color,scatter,g.scatterSeed||0);
   if(progress>=1){g.oldGlyph=null;g.changedAt=0}
  });
 }
 requestAnimationFrame(pixelLoop);
}
function setPixelPointer(e){const r=pixelCanvas.getBoundingClientRect();pixelPointer={x:e.clientX-r.left,y:e.clientY-r.top}}
pixelCanvas.addEventListener('pointermove',setPixelPointer);
pixelCanvas.addEventListener('pointerleave',()=>pixelPointer=null);
pixelCanvas.addEventListener('touchstart',e=>{if(e.touches[0])setPixelPointer(e.touches[0])},{passive:true});
pixelCanvas.addEventListener('touchmove',e=>{if(e.touches[0])setPixelPointer(e.touches[0])},{passive:true});
pixelCanvas.addEventListener('touchend',()=>pixelPointer=null);
window.addEventListener('resize',()=>{if(clockDesign==='pixel')resizePixelCanvas()});
pixelLoop();
// Webフォント読み込み完了後にピクセル文字を再生成
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{if(clockDesign==='pixel'){resizePixelCanvas();setPixelTime(lastClockText,true)}})}
// リアルタイム時計
const pad=n=>String(n).padStart(2,'0');
function updateClock(){const now=new Date();document.getElementById('clockDate').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);const nextText=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());document.getElementById('clockTime').textContent=nextText;if(nextText!==lastClockText){lastClockText=nextText;if(clockDesign==='pixel')setPixelTime(lastClockText)}}
updateClock();setInterval(updateClock,200);
// 複数カウントダウン
const targetDate=document.getElementById('targetDate'),countdownName=document.getElementById('countdownName'),countdownList=document.getElementById('countdownList');
let countdowns=[];
try{
 const saved=JSON.parse(localStorage.getItem('kubearma_clock_countdowns')||'null');
 if(Array.isArray(saved))countdowns=saved.filter(x=>x&&typeof x.id==='string'&&typeof x.target==='string');
 else{const old=localStorage.getItem('kubearma_clock_target');if(old)countdowns=[{id:'legacy-'+Date.now(),name:'カウントダウン',target:old}]}
}catch(e){}
function saveCountdowns(){try{localStorage.setItem('kubearma_clock_countdowns',JSON.stringify(countdowns));localStorage.removeItem('kubearma_clock_target')}catch(e){}}
function makeUnit(label,id){const box=document.createElement('div');box.className='unit';const strong=document.createElement('strong');strong.id=id;strong.textContent='0';const small=document.createElement('small');small.textContent=label;box.append(strong,small);return box}
function renderCountdowns(){
 countdownList.replaceChildren();
 if(!countdowns.length){const empty=document.createElement('div');empty.className='countdown-empty';empty.textContent='登録されたカウントダウンはありません';countdownList.append(empty);return}
 countdowns.forEach(item=>{
  const card=document.createElement('article');card.className='countdown-item';card.dataset.id=item.id;
  const head=document.createElement('div');head.className='countdown-item-head';
  const name=document.createElement('div');name.className='countdown-name';name.textContent=item.name||'カウントダウン';
  const del=document.createElement('button');del.type='button';del.className='countdown-delete';del.textContent='削除';del.setAttribute('aria-label',(item.name||'カウントダウン')+'を削除');
  del.addEventListener('click',()=>{countdowns=countdowns.filter(x=>x.id!==item.id);saveCountdowns();renderCountdowns()});
  head.append(name,del);
  const target=document.createElement('div');target.className='countdown-target';target.textContent=new Date(item.target).toLocaleString('ja-JP')+' まで';
  const display=document.createElement('div');display.className='countdown-display';
  const main=document.createElement('div');main.className='countdown-main';main.textContent='日時を確認しています';
  const units=document.createElement('div');units.className='countdown-units';
  const prefix=item.id.replace(/[^a-zA-Z0-9_-]/g,'');
  units.append(makeUnit('日',prefix+'-days'),makeUnit('時間',prefix+'-hours'),makeUnit('分',prefix+'-minutes'),makeUnit('秒',prefix+'-seconds'));
  display.append(main,units);card.append(head,target,display);countdownList.append(card);
 });
 updateCountdowns();
}
function updateCountdowns(){
 countdowns.forEach(item=>{
  const card=countdownList.querySelector('[data-id="'+CSS.escape(item.id)+'"]');if(!card)return;
  const main=card.querySelector('.countdown-main'),units=card.querySelector('.countdown-units');
  const target=new Date(item.target).getTime();
  if(!Number.isFinite(target)){main.textContent='日時を確認してください';units.hidden=true;return}
  const diff=target-Date.now();
  if(diff<=0){main.className='countdown-expired';main.textContent='時間になりました！';units.hidden=true;return}
  main.className='countdown-main';main.textContent='あと';units.hidden=false;
  const total=Math.floor(diff/1000),values=[Math.floor(total/86400),Math.floor(total%86400/3600),Math.floor(total%3600/60),total%60];
  ['days','hours','minutes','seconds'].forEach((key,i)=>{const el=card.querySelector('[id$="-'+key+'"]');if(el)el.textContent=i===0?values[i].toLocaleString('ja-JP'):pad(values[i])});
 });
}
document.getElementById('addCountdown').addEventListener('click',()=>{
 if(!targetDate.value){targetDate.focus();return}
 const target=new Date(targetDate.value).getTime();if(!Number.isFinite(target)){targetDate.focus();return}
 const name=countdownName.value.trim()||'カウントダウン '+(countdowns.length+1);
 countdowns.push({id:'cd-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name,target:targetDate.value});
 saveCountdowns();countdownName.value='';targetDate.value='';renderCountdowns();
});
renderCountdowns();setInterval(updateCountdowns,200);
// ストップウォッチ：performance.now()基準でタブ復帰後も経過時間を正確に算出
let running=false,startAt=0,elapsed=0,laps=[],raf=0;
const swTime=document.getElementById('stopwatchTime'),startBtn=document.getElementById('startStopwatch'),lapBtn=document.getElementById('lapStopwatch'),resetBtn=document.getElementById('resetStopwatch'),lapList=document.getElementById('lapList'),lapCount=document.getElementById('lapCount');
function currentElapsed(){return elapsed+(running?performance.now()-startAt:0)}
function formatStopwatch(ms){const cs=Math.floor(ms/10),minutes=Math.floor(cs/6000),seconds=Math.floor(cs%6000/100),centiseconds=cs%100;return pad(minutes)+':'+pad(seconds)+'.'+pad(centiseconds)}
function renderStopwatch(){swTime.textContent=formatStopwatch(currentElapsed());if(running)raf=requestAnimationFrame(renderStopwatch)}
function renderLaps(){lapCount.textContent=laps.length+'件';if(!laps.length){lapList.innerHTML='<li class="empty">ラップはまだありません</li>';return}
const best=Math.min(...laps.map(x=>x.split)),worst=Math.max(...laps.map(x=>x.split));lapList.innerHTML=laps.map((lap,i)=>'<li class="'+(laps.length>1&&lap.split===best?'best':laps.length>1&&lap.split===worst?'worst':'')+'"><span>#'+(laps.length-i)+'</span><span>'+formatStopwatch(lap.total)+'</span><span>+'+formatStopwatch(lap.split)+'</span></li>').join('')}
startBtn.addEventListener('click',()=>{if(!running){running=true;startAt=performance.now();startBtn.textContent='一時停止';lapBtn.disabled=false;cancelAnimationFrame(raf);renderStopwatch()}else{elapsed=currentElapsed();running=false;startBtn.textContent='再開';lapBtn.disabled=true;cancelAnimationFrame(raf);renderStopwatch()}});
lapBtn.addEventListener('click',()=>{if(!running)return;const total=currentElapsed(),previous=laps.length?laps[0].total:0;laps.unshift({total,split:total-previous});renderLaps()});
resetBtn.addEventListener('click',()=>{running=false;elapsed=0;startAt=0;laps=[];cancelAnimationFrame(raf);startBtn.textContent='スタート';lapBtn.disabled=true;renderStopwatch();renderLaps()});
renderStopwatch();renderLaps();
</script>
</body></html>
